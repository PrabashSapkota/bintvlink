<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Iframe</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

iframe {
    border: 0;
    width: 100%;
    height: 100%;
    display: block;
}
</style>
</head>
<body>

<iframe
    src="https://example.com"
    allowfullscreen
    loading="eager"
    referrerpolicy="no-referrer"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture">
</iframe>

</body>
</html>
